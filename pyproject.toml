[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tree"
version = "0.1.0"
description = "Multi-level tree-shaped sub-agent system"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "textual>=0.80.0",
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
    "langchain-openai>=0.3.0",
    "httpx[socks]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
agent-tree = "agent_tree.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tree"]
