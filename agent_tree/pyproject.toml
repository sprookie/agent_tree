[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tree"
version = "0.1.0"
description = "Multi-level tree-based coding agent harness with recursive subagent spawning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "llm", "langgraph", "langchain", "deep-agents", "tree", "subagent"]
dependencies = [
    "deepagents==0.6.8",
    "langchain>=1.3.4,<2.0.0",
    "langchain-openai>=1.2.0,<2.0.0",
    "langgraph>=1.2.4,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "textual>=8.2.7,<9.0.0",
    "rich>=14.0.0,<16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[project.scripts]
agent-tree = "agent_tree.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
